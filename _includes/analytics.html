{% if site.google_analytics %}
<!-- Google Analytics 4 (gtag.js) -->
<script
  id="ga4-tracker"
  fetchpriority="low"
  data-measurement-id="{{ site.google_analytics | escape }}"
  data-page-title="{{ page.title | strip_html | strip | default: site.name | escape }}"
  data-is-404="{% if page.permalink == '/404.html' %}true{% else %}false{% endif %}">
  (function () {
    var scriptEl = document.getElementById('ga4-tracker');
    if (!scriptEl) return;

    var measurementId = scriptEl.getAttribute('data-measurement-id') || '';
    if (!measurementId) return;

    // Persistent owner opt-out toggle: visit ?ga_optout=1 once on production to exclude your browser
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get('ga_optout') === '1') {
        window.localStorage.setItem('rm_ga_optout', '1');
      } else if (params.get('ga_optout') === '0') {
        window.localStorage.removeItem('rm_ga_optout');
      }
      if (window.localStorage.getItem('rm_ga_optout') === '1') {
        window['ga-disable-' + measurementId] = true;
        return;
      }
    } catch (_) {}

    var host = window.location.hostname || '';
    var isLocal =
      window.location.protocol === 'file:' ||
      host === 'localhost' ||
      host === '127.0.0.1' ||
      host === '[::1]' ||
      host.endsWith('.local');
    if (isLocal) return;

    var is404 = scriptEl.getAttribute('data-is-404') === 'true';
    var pageTitle = scriptEl.getAttribute('data-page-title') || document.title;

    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    window.gtag = gtag;

    var gtagScript = document.createElement('script');
    gtagScript.async = true;
    gtagScript.fetchPriority = 'low';
    gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
    document.head.appendChild(gtagScript);

    gtag('js', new Date());
    gtag('config', measurementId, {
      page_title: pageTitle,
      page_path: is404 ? '/404.html' : window.location.pathname,
      transport_type: 'beacon'
    });

    // Log exact broken URL on unrecovered 404s without polluting the main Pages report
    if (is404) {
      var refHost = '(direct)';
      if (document.referrer) {
        try { refHost = new URL(document.referrer).hostname || '(direct)'; } catch (_) {}
      }
      gtag('event', 'page_not_found', {
        broken_path: window.location.pathname,
        referrer_host: refHost
      });
    } else {
      // Flush deferred telemetry from instant 404 recovery or legacy path redirects
      try {
        var recoveredFrom = window.sessionStorage.getItem('rm_404_recovered');
        if (recoveredFrom) {
          window.sessionStorage.removeItem('rm_404_recovered');
          gtag('event', 'smart_404_redirect', {
            from_path: recoveredFrom,
            to_path: window.location.pathname
          });
        }
        var legacyFrom = window.sessionStorage.getItem('rm_legacy_redirect');
        if (legacyFrom) {
          window.sessionStorage.removeItem('rm_legacy_redirect');
          gtag('event', 'legacy_redirect_hit', {
            from_path: legacyFrom,
            to_path: window.location.pathname
          });
        }
      } catch (_) {}
    }

    // Delegated high-intent CTA, PDF, BibTeX & Share conversion tracking (data-minimized: no PII)
    document.addEventListener('click', function (e) {
      if (typeof window.gtag !== 'function' || !e.target || !e.target.closest) return;

      var copyBibBtn = e.target.closest('.copy-bibtex-btn');
      if (copyBibBtn) {
        var card = copyBibBtn.closest('.pub-card');
        var heading = card ? card.querySelector('.pub-title') : null;
        window.gtag('event', 'bibtex_copy', {
          item_title: heading ? heading.textContent.trim().slice(0, 100) : 'publication',
          source_page: window.location.pathname
        });
        return;
      }

      var copyShareBtn = e.target.closest('.post-share-copy');
      if (copyShareBtn) {
        window.gtag('event', 'share_click', {
          method: 'copy_link',
          source_page: window.location.pathname
        });
        return;
      }

      var filterBtn = e.target.closest('[data-blog-filter]');
      if (filterBtn) {
        window.gtag('event', 'blog_filter_select', {
          topic_cluster: filterBtn.getAttribute('data-blog-filter') || 'all'
        });
        return;
      }

      var link = e.target.closest('a[href]');
      if (!link) return;

      var rawHref = link.getAttribute('href') || '';
      if (!rawHref || rawHref.charAt(0) === '#') return;

      if (rawHref.toLowerCase().indexOf('mailto:') === 0) {
        window.gtag('event', 'cta_click', {
          cta_category: 'contact_email',
          source_page: window.location.pathname
        });
        return;
      }

      var parsed;
      try {
        parsed = new URL(link.href, window.location.origin);
      } catch (_) {
        return;
      }

      var cleanDest = parsed.origin + parsed.pathname;
      var lowerDest = cleanDest.toLowerCase();

      if (link.hasAttribute('data-share-network')) {
        window.gtag('event', 'share_click', {
          method: link.getAttribute('data-share-network') || 'social',
          source_page: window.location.pathname
        });
        return;
      }

      if (lowerDest.slice(-4) === '.pdf') {
        var parts = parsed.pathname.split('/');
        window.gtag('event', 'pdf_download', {
          file_name: decodeURIComponent(parts[parts.length - 1] || 'document.pdf'),
          source_page: window.location.pathname
        });
        return;
      }

      var category = '';
      if (lowerDest.indexOf('naano.com') !== -1 || rawHref.indexOf('#media-kit') !== -1) {
        category = 'creator_media_kit';
      } else if (parsed.origin === window.location.origin && parsed.pathname.indexOf('/collaborate') === 0) {
        category = 'collaborate_funnel';
      } else if (lowerDest.indexOf('mentorcruise.com') !== -1 || lowerDest.indexOf('meetapro.com') !== -1) {
        category = 'mentorship_booking';
      } else if (
        lowerDest.indexOf('udacity.com') !== -1 ||
        lowerDest.indexOf('linkedin.com/learning') !== -1 ||
        lowerDest.indexOf('interviewkickstart.com') !== -1
      ) {
        category = 'course_enrollment';
      } else if (lowerDest.indexOf('amazon.com') !== -1 || lowerDest.indexOf('amzn.to') !== -1) {
        category = 'book_amazon';
      } else if (lowerDest.indexOf('kaggle.com') !== -1) {
        category = 'dataset_kaggle';
      } else if (lowerDest.indexOf('scholar.google.') !== -1) {
        category = 'google_scholar';
      } else if (
        lowerDest.indexOf('youtube.com') !== -1 ||
        lowerDest.indexOf('sched.com') !== -1 ||
        lowerDest.indexOf('ida.dk') !== -1
      ) {
        category = 'keynote_talk';
      }

      if (category) {
        window.gtag('event', 'cta_click', {
          cta_category: category,
          destination_path: cleanDest,
          source_page: window.location.pathname
        });
      }
    });

    // Passive reading-depth milestones (50% and 90%) on long-form blog articles
    var articleEl = document.querySelector('.post-article');
    if (articleEl) {
      var fired50 = false;
      var fired90 = false;
      var onScroll = function () {
        var rect = articleEl.getBoundingClientRect();
        var total = rect.height - window.innerHeight;
        if (total <= 0) return;
        var ratio = Math.min(1, Math.max(0, -rect.top / total));
        if (!fired50 && ratio >= 0.5) {
          fired50 = true;
          window.gtag('event', 'article_read_depth', {
            percent_scrolled: 50,
            page_path: window.location.pathname
          });
        }
        if (!fired90 && ratio >= 0.9) {
          fired90 = true;
          window.gtag('event', 'article_read_depth', {
            percent_scrolled: 90,
            page_path: window.location.pathname
          });
          window.removeEventListener('scroll', onScroll);
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
    }
  })();
</script>
<!-- End Google Analytics 4 -->
{% endif %}
