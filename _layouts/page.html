---
layout: default
---

<article class="page{% unless page.hide_title %} page-prose-shell{% endunless %}">
  {% if page.back_url %}
  <div class="post-back-row">
    <a href="{{ site.baseurl }}{{ page.back_url }}" class="post-back-link"><span aria-hidden="true">←</span> {{ page.back_label | default: "Back" }}</a>
  </div>
  {% endif %}

  {% if page.title and page.hide_title != true %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title | strip_html }}</h1>
  </header>
  {% endif %}

  <div class="entry{% unless page.hide_title %} post-prose{% endunless %}">
    {{ content }}
  </div>
</article>
